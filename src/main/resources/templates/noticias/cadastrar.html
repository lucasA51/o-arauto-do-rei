<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Redigir Decreto · O Arauto do Rei')}">
</head>
<body>
<div th:replace="~{fragments/layout :: raven-banner}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-medieval p-4">
                <h2 class="font-cinzel text-gold mb-4 border-bottom border-gold pb-2">✍️ Redigir Novo Decreto Imperial</h2>

                <form method="post" th:action="@{/noticias/cadastrar}" th:object="${noticia}">
                    <div class="mb-3">
                        <label for="titulo" class="form-label font-cinzel text-gold">Título do Decreto</label>
                        <input type="text" class="form-control input-medieval" id="titulo" th:field="*{titulo}" placeholder="Ex: O Rei Aegon VI e a Luta pelo Trono de Ferro" required>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label font-cinzel text-gold">Resumo / Parágrafo de Abertura (Lead)</label>
                        <textarea class="form-control input-medieval" id="descricao" th:field="*{descricao}" rows="3" placeholder="Resumo em destaque para leitores e mensageiros..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="conteudoCompleto" class="form-label font-cinzel text-gold">Corpo Completo da Crônica</label>
                        <textarea class="form-control input-medieval" id="conteudoCompleto" th:field="*{conteudoCompleto}" rows="7" placeholder="Transcrição integra do pergaminho..."></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="casaNobre" class="form-label font-cinzel text-gold">Casa Nobre Envolvida</label>
                            <input type="text" class="form-control input-medieval" id="casaNobre" th:field="*{casaNobre}" placeholder="Ex: Stark, Lannister, Targaryen">
                        </div>
                        <div class="col-md-4">
                            <label for="regiao" class="form-label font-cinzel text-gold">Região de Origem</label>
                            <input type="text" class="form-control input-medieval" id="regiao" th:field="*{regiao}" placeholder="Ex: Porto Real, O Norte, Essos">
                        </div>
                        <div class="col-md-4">
                            <label for="autor" class="form-label font-cinzel text-gold">Autor / Escriba</label>
                            <input type="text" class="form-control input-medieval" id="autor" th:field="*{autor}" placeholder="Ex: Arquimestre Gyldayn">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="imagemURL" class="form-label font-cinzel text-gold">Caminho da Ilustração / URL da Imagem</label>
                        <input type="text" class="form-control input-medieval" id="imagemURL" th:field="*{imagemURL}" placeholder="/images/news1-image.png" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/noticias/listar}" class="btn btn-outline-gold font-cinzel">Cancelar</a>
                        <button type="submit" class="btn btn-gold font-cinzel">Promulgar e Registrar Decreto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/scripts/bootstrap.bundle.min.js}"></script>
<script th:src="@{/scripts/script.js}"></script>
</body>
</html>
