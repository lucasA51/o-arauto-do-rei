<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Torre dos Escribas · O Arauto do Rei')}">
</head>
<body>
<div th:replace="~{fragments/layout :: raven-banner}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-gold">
        <div>
            <h1 class="font-cinzel text-gold m-0">📜 Torre dos Escribas (Curadoria de Édictos)</h1>
            <p class="font-garamond text-parchment-light m-0">Gerencie, redija e edite as publicações oficiais do Trono de Ferro</p>
        </div>
        <a th:href="@{/noticias/cadastrar}" class="btn btn-gold font-cinzel">+ Redigir Novo Decreto</a>
    </div>

    <div class="card card-medieval p-3">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle m-0 border-gold">
                <thead class="font-cinzel text-gold bg-gold-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Casa Nobre</th>
                    <th>Região</th>
                    <th>Autor</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody class="font-garamond">
                <tr th:each="noticia : ${noticias}">
                    <td th:text="${noticia.id}">1</td>
                    <td class="text-gold fw-bold" th:text="${noticia.titulo}">Título</td>
                    <td th:text="${noticia.casaNobre != null ? noticia.casaNobre : '-'}">Casa</td>
                    <td th:text="${noticia.regiao != null ? noticia.regiao : '-'}">Região</td>
                    <td th:text="${noticia.autor != null ? noticia.autor : 'Escriba'}">Autor</td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/noticias/editar/{id}(id=${noticia.id})}" class="btn btn-sm btn-outline-gold">Editar</a>
                            <a th:href="@{/noticias/excluir/{id}(id=${noticia.id})}" onclick="return confirm('Revogar este decreto permanentemente dos registros?');" class="btn btn-sm btn-danger ms-1">Excluir</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/scripts/bootstrap.bundle.min.js}"></script>
<script th:src="@{/scripts/script.js}"></script>
</body>
</html>
