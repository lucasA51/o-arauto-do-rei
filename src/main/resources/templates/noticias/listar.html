<!DOCTYPE html>
<html data-bs-theme="dark" lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar Notícias</title>
    <link rel="stylesheet" th:href="@{/stylesheets/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/stylesheets/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand" th:href="@{/}">O Arauto</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<div class="container mt-5">
    <h2>Listar Notícias</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="noticia : ${noticias}">
            <td th:text="${noticia.id}">1</td>
            <td th:text="${noticia.titulo}">Título da Notícia</td>
            <td th:text="${noticia.descricao}">Descrição da Notícia</td>
            <td>
                <div class="btn-group" role="group">
                    <a th:href="@{/noticias/editar/{id}(id=${noticia.id})}" class="btn btn-warning">Editar</a>
                    <a th:href="@{/noticias/excluir/{id}(id=${noticia.id})}" class="btn btn-danger ml-2">Excluir</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-4">
        <a th:href="@{/noticias/cadastrar}" class="btn btn-primary">Cadastro</a>
    </div>

</div>

<script src="/scripts/jquery-3.5.1.slim.min.js"></script>
<script src="/scripts/popper.min.js"></script>
<script src="/scripts/bootstrap.bundle.min.js"></script>
<script src="/scripts/script.js"></script>
</body>
</html>
