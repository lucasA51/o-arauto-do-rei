<!DOCTYPE html>
<html data-bs-theme="dark" lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Notícia</title>
    <link rel="stylesheet" th:href="@{/stylesheets/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/stylesheets/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand" th:href="@{/}">O Arauto</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <!--<li class="nav-item"><a class="nav-link" th:href="@{/noticias-do-reino}">Notícias do Reino</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/economia-e-comercio}">Economia e Comércio</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/vida-na-corte}">Vida na Corte</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/cronicas-e-opinioes}">Crônicas e Opiniões</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/arte-e-cultura}">Arte e Cultura</a></li>-->
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h2>Editar Notícia</h2>
    <form th:action="@{/noticias/atualizar}" th:object="${noticia}" method="post">
        <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" class="form-control" th:field="*{titulo}" required>
        </div>
        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" class="form-control" th:field="*{descricao}" rows="5" required></textarea>
        </div>
        <div class="form-group">
            <label for="imagemURL">Link para Imagem</label>
            <textarea id="imagemURL" name="imagemURL" class="form-control" th:field="*{imagemURL}" rows="5" required></textarea>
        </div>
        <div class="form-group">
            <input type="hidden" name="id" th:field="*{id}">
        </div>
        <div class="form-group text-center">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/noticias/listar}" class="btn btn-secondary ml-2">Cancelar</a>
        </div>
    </form>
</div>

<script src="/scripts/jquery-3.5.1.slim.min.js"></script>
<script src="/scripts/popper.min.js"></script>
<script src="/scripts/bootstrap.bundle.min.js"></script>
<script src="/scripts/script.js"></script>
</body>
</html>
