<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar Escriba · O Arauto do Rei')}">
</head>
<body>
<div th:replace="~{fragments/layout :: raven-banner}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-medieval p-4 shadow-lg">
                <div class="text-center mb-4">
                    <span class="fs-1">✍️</span>
                    <h2 class="font-cinzel text-gold m-0">Registro de Escriba Real</h2>
                    <p class="font-garamond text-parchment-light small">Inscreva-se na chancelaria para obter permissões de redação</p>
                </div>

                <form th:action="@{/usuarios/registrar}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label font-cinzel text-gold">Nome de Escriba</label>
                        <input type="text" class="form-control input-medieval" id="username" name="username" placeholder="Escolha um nome único" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label font-cinzel text-gold">Palavra de Passe</label>
                        <input type="password" class="form-control input-medieval" id="password" name="password" placeholder="Defina uma senha segura" required>
                    </div>

                    <div th:if="${erro}" class="alert alert-danger font-cinzel small my-3" th:text="${erro}">
                        Erro no registro.
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-gold font-cinzel py-2">Confirmar Inscrição na Ordem</button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-gold">
                    <a th:href="@{/usuarios/login}" class="btn btn-outline-gold btn-sm font-cinzel">&laquo; Já possui login? Fazer Acesso</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/scripts/bootstrap.bundle.min.js}"></script>
<script th:src="@{/scripts/script.js}"></script>
</body>
</html>
