<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuário</title>
    <link rel="stylesheet" th:href="@{/stylesheets/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/stylesheets/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand" th:href="@{/}">O Arauto</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <!--<li class="nav-item"><a class="nav-link" th:href="@{/noticias-do-reino}">Notícias do Reino</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/economia-e-comercio}">Economia e Comércio</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/vida-na-corte}">Vida na Corte</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/cronicas-e-opinioes}">Crônicas e Opiniões</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/arte-e-cultura}">Arte e Cultura</a></li>-->
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h2>Registro de Usuário</h2>
    <form th:action="@{/usuarios/registrar}" method="post">
        <div class="form-group">
            <label for="usuario">Nome de Usuário</label>
            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Digite seu nome de usuário" required>
        </div>
        <div class="form-group mt-3">
            <label for="senha">Senha</label>
            <input type="senha" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>

        <!-- Mensagem de erro -->
        <div th:if="${erro}" class="alert alert-danger mt-3">
            <span th:text="${erro}"></span>
        </div>

        <div class="form-group mt-4">
            <button type="submit" class="btn btn-primary">Registrar</button>
        </div>
    </form>
</div>

<script src="/scripts/jquery-3.5.1.slim.min.js"></script>
<script src="/scripts/popper.min.js"></script>
<script src="/scripts/bootstrap.bundle.min.js"></script>
<script src="/scripts/script.js"></script>
</body>
</html>
