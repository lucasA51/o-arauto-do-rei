<!DOCTYPE html>
<html data-bs-theme="dark" lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/stylesheets/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/stylesheets/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light">
    <a class="navbar-brand" th:href="@{/}">O Arauto</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <!-- Links de navegação aqui, se necessário -->
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h2>Login</h2>

    <form action="/usuarios/login" method="post">
        <div class="form-group">
            <label for="usuario">Nome de Usuário</label>
            <input type="text" class="form-control" id="usuario" name="username" placeholder="Digite seu nome de usuário" required>
        </div>
        <div class="form-group mt-3">
            <label for="senha">Senha</label>
            <input type="password" class="form-control" id="senha" name="password" placeholder="Digite sua senha" required>
        </div>

        <!-- Mensagens de erro -->
        <div th:if="${param.error}" class="alert alert-danger mt-3">
            <span th:text="'Nome de usuário ou senha incorretos.'">Erro de login</span>
        </div>

        <!-- Mensagens de sucesso -->
        <div th:if="${param.success}" class="alert alert-success mt-3">
            <span th:text="${param.success}">Login bem-sucedido</span>
        </div>

        <div class="form-group mt-4">
            <button type="submit" class="btn btn-primary">Login</button>
        </div>
    </form>
</div>

<div class="text-center mt-4">
    <a th:href="@{/usuarios/registrar}" class="btn btn-primary">Registrar</a>
</div>

<script src="/scripts/jquery-3.5.1.slim.min.js"></script>
<script src="/scripts/popper.min.js"></script>
<script src="/scripts/bootstrap.bundle.min.js"></script>
<script src="/scripts/script.js"></script>
</body>
</html>
