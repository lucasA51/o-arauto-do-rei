<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${categoriaTitulo != null ? categoriaTitulo : 'Arte & Cultura'} + ' · O Arauto do Rei')}">
</head>
<body>
<div th:replace="~{fragments/layout :: raven-banner}"></div>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="header-medieval text-center mb-5">
        <h1 class="font-cinzel text-gold display-4" th:text="${categoriaTitulo != null ? categoriaTitulo : 'Arte & Cultura'}">Arte & Cultura</h1>
        <p class="font-garamond text-parchment-light fs-5" th:text="${categoriaSubtitulo != null ? categoriaSubtitulo : 'Baladas dos Bardos, Poesia Valiriana e Tapeçaria'}">Baladas dos Bardos, Poesia Valiriana e Tapeçaria</p>
        <hr class="border-gold w-25 mx-auto">
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div th:each="noticia : ${noticias}" class="card card-medieval mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span th:if="${noticia.casaNobre != null}" class="badge bg-gold-dark text-gold font-cinzel border border-gold" th:text="${'🛡️ Casa ' + noticia.casaNobre}">Casa</span>
                        <span th:if="${noticia.regiao != null}" class="badge bg-dark text-parchment-light font-cinzel" th:text="${'📍 ' + noticia.regiao}">Região</span>
                    </div>
                    <h4 class="card-title text-gold" th:text="${noticia.titulo}">Título da Notícia</h4>
                    <p class="card-text text-parchment-light font-garamond" th:text="${noticia.descricao}">Descrição da Notícia</p>
                    <a th:href="@{/noticia/{id}(id=${noticia.id})}" class="btn btn-gold font-cinzel btn-sm">Ler Decreto Completo &raquo;</a>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div th:replace="~{fragments/layout :: small-council-sidebar}"></div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/scripts/bootstrap.bundle.min.js}"></script>
<script th:src="@{/scripts/script.js}"></script>
</body>
</html>
