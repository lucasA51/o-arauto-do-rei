spring.application.name=o-arauto-do-rei

# Configurações para conexão com a base de dados
spring.datasource.url=jdbc:mysql://localhost:3306/oarautodorei?useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345

# Configurações JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#spring.security.enabled=false descomente em caso de erro na função de login




